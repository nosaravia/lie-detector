let soloGame=JSON.parse(localStorage.getItem('ld-solo')||'null'),soloTimer=null;
function saveSolo(){if(soloGame)localStorage.setItem('ld-solo',JSON.stringify(soloGame));else localStorage.removeItem('ld-solo')}
function startSolo(){const cases=[...caseLibrary].sort(()=>Math.random()-.5);soloGame={cases,character:selectedAvatar,index:0,score:0,correct:0,streak:0,bestStreak:0,phase:'play',selected:null,deadline:Date.now()+15000};saveSolo();render();clearInterval(soloTimer);soloTimer=setInterval(updateSoloTimer,250)}
function updateSoloTimer(){if(!soloGame||soloGame.phase!=='play')return;const left=Math.max(0,Math.ceil((soloGame.deadline-Date.now())/1000));const el=document.querySelector('.solo-timer');if(el){el.textContent=`${left}s`;el.classList.toggle('urgent',left<=5)}if(left>0&&left<=3)tickSound(left);if(left<=0)revealSolo(-1)}
function revealSolo(choice){if(!soloGame||soloGame.phase!=='play')return;tone(420,.1,'triangle',.3);tone(620,.09,'sine',.2,.045);const entry=soloGame.cases[soloGame.index],left=Math.max(0,Math.ceil((soloGame.deadline-Date.now())/1000));soloGame.selected=choice;soloGame.phase='reveal';soloGame.lastCorrect=choice===entry.lie;soloGame.lastBonus=soloGame.lastCorrect?Math.round(50*left/15):0;if(soloGame.lastCorrect){soloGame.correct++;soloGame.score+=100+soloGame.lastBonus;soloGame.streak++;soloGame.bestStreak=Math.max(soloGame.bestStreak,soloGame.streak)}else soloGame.streak=0;saveSolo();render()}
function nextSolo(){if(!soloGame)return;if(soloGame.index>=soloGame.cases.length-1){soloGame.phase='finished';saveSolo();render();return}soloGame.index++;soloGame.phase='play';soloGame.selected=null;soloGame.deadline=Date.now()+15000;saveSolo();render()}
function soloRank(){const n=soloGame.correct,total=soloGame.cases.length,p=n/total;return p===1?'Chief Inspector':p>=.75?'Senior Detective':p>=.5?'Detective':p>=.25?'Rookie Officer':'Easily Fooled Witness'}
function exitSolo(){soloGame=null;clearInterval(soloTimer);saveSolo();render()}
function renderSoloScreen(){const c=soloGame.cases[soloGame.index];if(soloGame.phase==='play'){app.innerHTML=`<div class="eyebrow">SOLO CASE FILE ${soloGame.index+1} OF ${soloGame.cases.length} · ${esc(c.topic)}</div><h1 class="title">Spot the false lead.</h1><p class="sub">One statement is false. Tap it before the clock runs out.</p><section class="solo-stats"><span>CASE SCORE <b>${soloGame.score}</b></span><span>STREAK <b>${soloGame.streak} 🔥</b></span><span class="solo-timer ${Math.ceil((soloGame.deadline-Date.now())/1000)<=5?'urgent':''}">${Math.max(0,Math.ceil((soloGame.deadline-Date.now())/1000))}s</span></section><section class="card"><div class="sectionhead"><h2>Evidence slips</h2><span class="eyebrow">CHOOSE THE LIE</span></div>${c.items.map((s,i)=>`<button class="statement" onclick="revealSolo(${i})"><span class="num">0${i+1}</span><span>${esc(s)}</span></button>`).join('')}<p class="small">Correct cases earn 100 points plus a speed bonus of up to 50.</p></section>`;return}if(soloGame.phase==='reveal'){app.innerHTML=`<div class="eyebrow">CASE ${soloGame.index+1} · ${soloGame.lastCorrect?'CORRECT CALL':'CASE EXPLAINED'}</div><h1 class="title">${soloGame.lastCorrect?'Good detective work.':'The evidence speaks.'}</h1><section class="card"><div class="sectionhead"><h2>${esc(c.topic)}</h2><span class="eyebrow">CASE FINDING</span></div><div class="revealed">${c.items.map((s,i)=>`<div class="statement reveal-row ${i===c.lie?'lie':'true'}"><span class="num">0${i+1}</span><span style="flex:1">${esc(s)}</span><span class="stamp ${i===c.lie?'lie-stamp':'true-stamp'}">${i===c.lie?'LIE!':'TRUE'}</span></div>`).join('')}</div><div class="solo-explanation"><b>WHY IT’S FALSE</b><p>${esc(c.explanation)}</p></div><div class="solo-result">${soloGame.lastCorrect?`+${100+soloGame.lastBonus} points · +${soloGame.lastBonus} speed bonus`:'No points this case'} <span>Current streak: ${soloGame.streak}</span></div></section><button class="btn" style="width:100%" onclick="nextSolo()">${soloGame.index===soloGame.cases.length-1?'See your rank →':'Next case →'}</button>`;return}app.innerHTML=`<div class="eyebrow center">${soloGame.cases.length} CASES CLOSED</div><h1 class="title center">${soloRank()}</h1><section class="card center"><div class="rank-seal">★</div><h2 class="solo-rank-name">${soloRank()}</h2><p class="sub">You caught ${soloGame.correct} of ${soloGame.cases.length} lies.</p><div class="solo-final-stats"><span><b>${soloGame.score}</b> total points</span><span><b>${soloGame.bestStreak}</b> best streak</span></div></section><button class="btn" style="width:100%" onclick="startSolo()">Play again</button><button class="btn ghost" style="width:100%;margin-top:10px" onclick="exitSolo()">Back to start</button>`}
function toggleCustomClass(){const el=document.querySelector('.custom-class-fields');if(el)el.hidden=document.querySelector('#classTopic').value!=='Custom case'}
async function createClassroom(){try{const name=document.querySelector('#teacherName').value.trim(),topic=document.querySelector('#classTopic').value;if(!name)throw Error('Enter the teacher name.');let cases;if(topic==='Custom case'){const items=[0,1,2].map(i=>document.querySelector(`#c${i}`).value.trim()),lie=Number(document.querySelector('input[name=classlie]:checked').value),explanation=document.querySelector('#classExplanation').value.trim();if(items.some(x=>!x)||!explanation)throw Error('Complete all three statements and the explanation.');cases=[{items,lie,explanation}]}else cases=topic==='Mixed'?caseLibrary:caseLibrary.filter(c=>c.topic===topic);const result=await post('create',{name,character:selectedAvatar,mode:'classroom',topic,cases});me={room:result.code,id:result.id};localStorage.setItem('ld-player',JSON.stringify(me));connect()}catch(e){const err=document.querySelector('#classError');if(err)err.textContent=e.message}}

function animateHomeTrace(){const svg=document.querySelector('.home-polygraph svg'),trace=document.querySelector('#homePolyLine'),needle=document.querySelector('#homeNeedle'),shadow=document.querySelector('#homeNeedleShadow'),tip=document.querySelector('#homeNeedleTip');if(!svg||!trace||!needle||!shadow||!tip)return;const W=720,anchor=430,step=2,base=34,count=anchor/step;let samples=new Array(count+1).fill(base),wave=[],nextPulse=performance.now()+800,lastStep=0,lastY=base;function makePulse(now){const amp=(Math.random()<.42?17:7)+Math.random()*11;wave=[0,-amp*.08,amp*.16,-amp*.55,amp,-amp*1.18,amp*.67,-amp*.27,amp*.1,0];nextPulse=now+850+Math.random()*1900}function frame(now){if(!trace.isConnected)return;if(!lastStep)lastStep=now;const steps=Math.min(8,Math.floor((now-lastStep)/36));if(steps){lastStep+=steps*36;for(let i=0;i<steps;i++){if(!wave.length&&now>=nextPulse)makePulse(now);const offset=wave.length?wave.shift():(Math.random()-.5)*.75;lastY=Math.max(3,Math.min(65,base+offset));samples.shift();samples.push(lastY)}}const d=samples.map((y,i)=>`${i?'L':'M'}${i*step} ${y.toFixed(2)}`).join(' ');trace.setAttribute('d',d);needle.setAttribute('d',`M${anchor} ${lastY.toFixed(2)}H${W}`);shadow.setAttribute('d',`M${anchor} ${(lastY+5).toFixed(2)}H${W}`);tip.setAttribute('d',`M${anchor-12} ${lastY.toFixed(2)}L${anchor} ${(lastY-1.3).toFixed(2)}L${anchor} ${(lastY+1.3).toFixed(2)}Z`);requestAnimationFrame(frame)}requestAnimationFrame(frame)}function startScreen(){app.innerHTML=document.querySelector('#homeTemplate').innerHTML;document.querySelector('#homeAvatarPicker').outerHTML=pickerMarkup();animateHomeTrace();document.querySelector('#joinName').addEventListener('input',()=>{document.querySelector('#teacherName').value=document.querySelector('#joinName').value})}

async function createRoom(){const nameField=document.querySelector('#joinName'),name=nameField.value.trim();if(!name){setErr('Detective name needed — enter your name above to create a room.');nameField.setAttribute('aria-invalid','true');Object.assign(nameField.style,{minHeight:'56px',border:'2px solid #c93229',boxShadow:'0 0 0 4px #c9322933',fontSize:'16px'});const label=document.querySelector('label[for="joinName"]');if(label)Object.assign(label.style,{color:'#51452f',fontWeight:'800',fontSize:'12px'});nameField.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>nameField.focus({preventScroll:true}),220);return}nameField.removeAttribute('aria-invalid');nameField.style.border='';nameField.style.boxShadow='';setErr('');try{const r=await post('create',{name,character:selectedAvatar});me={room:r.code,id:r.id};localStorage.setItem('ld-player',JSON.stringify(me));connect()}catch(e){setErr(e.message)}}
async function joinRoom(){try{const name=document.querySelector('#joinName').value.trim(),room=document.querySelector('#joinCode').value.trim().toUpperCase();if(!name||!room)throw Error('Enter your name and room code.');const res=await fetch(GAME_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'join',code:room,name,character:selectedAvatar})});const r=await res.json();if(!res.ok)throw Error(r.error);me={room,id:r.id};localStorage.setItem('ld-player',JSON.stringify(me));connect()}catch(e){setErr(e.message)}}
